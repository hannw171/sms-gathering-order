name: sms_gathering_order
description: "SMS Gathering Ordering & Live Leaderboard Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management (MVVM / ChangeNotifier)
  provider: ^6.1.2

  # Networking & REST API
  dio: ^5.4.3+1

  # Localization & Indonesian Formatting
  intl: ^0.19.0

  # Typography (Plus Jakarta Sans & Poppins)
  google_fonts: ^6.2.1

  # Persistent Storage
  shared_preferences: ^2.2.3

  # Vector Assets
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
